<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ころころパズル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6EFF6;--ink:#1F2A44;--sub:#5B6782;--board:#274F8E;--rim:#183766;--well:#1E4078;
  --tile:#FFFFFF;--groove:#C9D3E3;--fixed:#F6C343;--fixedG:#D9A21C;--tunnel:#5E6B80;
  --panel:#FFFFFF;--line:#C9D6E4;--accent:#274F8E;
  --red:#E23B3B;--orange:#F08A24;--green:#22A55B;--teal:#12A1A8;--blue:#2F6FE0;--purple:#8E5BD8;--pink:#E85A9B;
  --cs:80px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141B28;--ink:#E7ECF5;--sub:#9AA7BF;--panel:#1E2738;--line:#33415A;--accent:#8FB2F0;
}}
:root[data-theme="dark"]{--bg:#141B28;--ink:#E7ECF5;--sub:#9AA7BF;--panel:#1E2738;--line:#33415A;--accent:#8FB2F0;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",sans-serif;font-weight:500;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800;margin:0;letter-spacing:.02em;line-height:1.2}
h1 .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-left:.08em;vertical-align:.05em}
.lead{margin:4px 0 0;color:var(--sub);font-size:.95rem}
.tabs{display:flex;gap:6px;background:var(--panel);padding:5px;border-radius:999px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--board);color:#fff}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.nums button{width:38px;height:38px;font-size:.9rem;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;position:relative}
.nums button[aria-current="true"]{border-color:var(--board);background:var(--board);color:#fff}
.nums button.done::after{content:"";position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--bg)}
main{display:grid;grid-template-columns:minmax(0,auto) minmax(250px,1fr);gap:24px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}

.stage{display:flex;justify-content:center}
.board{position:relative;background:var(--board);border-radius:26px;padding:14px;box-shadow:inset 0 -6px 0 var(--rim),0 10px 24px rgba(20,40,80,.25)}
.lanes{position:relative;width:calc(var(--cols)*var(--cs))}
.zone{height:calc(var(--cs)*var(--zf,.9));display:grid;grid-template-columns:repeat(var(--cols),var(--cs))}
.slot{display:flex;align-items:center;justify-content:center}
.start .slot::before{content:"";width:calc(var(--cs)*.62);height:calc(var(--cs)*.62);border-radius:50%;background:var(--well);box-shadow:inset 0 3px 6px rgba(0,0,0,.35)}
.goal .cup{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--cs)*.26);width:calc(var(--cs)*.72);height:calc(var(--cs)*.62);border-radius:8px 8px 22px 22px;background:var(--well);box-shadow:inset 0 3px 6px rgba(0,0,0,.35);border:4px solid transparent}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-template-rows:repeat(var(--rows),var(--cs))}
.cell{margin:3px;border-radius:10px;border:0;padding:0;position:relative;font:inherit}
.empty{background:var(--well);box-shadow:inset 0 3px 6px rgba(0,0,0,.35);cursor:pointer}
.empty:hover{outline:3px dashed rgba(255,255,255,.55);outline-offset:-6px}
.piece{background:var(--tile);box-shadow:0 3px 0 #B7C3D6;cursor:pointer}
.piece.fixed{background:var(--fixed);box-shadow:0 3px 0 var(--fixedG);cursor:default}
.piece svg{position:absolute;inset:0;width:100%;height:100%}
.tunnel{background:var(--tunnel);box-shadow:0 3px 0 #3E4859;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;z-index:3;cursor:default}
.tunnel svg{width:70%;height:70%}
button:focus-visible{outline:3px solid #FFB020;outline-offset:2px}
.ballLayer{position:absolute;inset:0;pointer-events:none;z-index:2}
.ball{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--cs)*.24);text-shadow:0 1px 1px rgba(0,0,0,.35);position:absolute;background-image:radial-gradient(circle at 32% 30%,rgba(255,255,255,.55) 0 18%,transparent 19%);width:calc(var(--cs)*.5);height:calc(var(--cs)*.5);margin:calc(var(--cs)*-.25) 0 0 calc(var(--cs)*-.25);border-radius:50%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.35),0 3px 4px rgba(0,0,0,.3);transition:opacity .12s}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel h2{font-size:1.05rem;margin:0 0 10px;font-weight:800}
.tray{display:flex;gap:10px;margin-bottom:12px}
.dock .msg{margin:0 0 14px}
.actions{margin-top:10px}
.qbar{display:flex;align-items:center;gap:6px;margin:0 0 18px}
.qbar .nums{margin:0}
.arrow{display:none;flex:0 0 36px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:1.4rem;font-weight:800;line-height:1;cursor:pointer}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tray button{flex:1;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 8px;cursor:pointer;font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.tray button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tray button:disabled{opacity:.4;cursor:not-allowed}
.tray .mini.s{width:44px}.tray .mini.x{width:88px}
.tray .mini{height:44px;background:#fff;border:1.5px solid #B7C3D6;border-radius:8px;box-shadow:0 2px 0 #B7C3D6;overflow:hidden;position:relative}
.tray .mini svg{width:100%;height:100%;display:block}
.count{font-size:1.25rem;font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--line);color:var(--ink)}
.btn.primary{background:var(--board);color:#fff;width:100%;font-size:1.1rem}
.btn.primary.go{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:3.2em;margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--bg);font-weight:700}
.msg.ok{background:#DFF5E7;color:#135C33}
.msg.ng{background:#FDE5E3;color:#8A231C}
.rules{margin-top:16px;font-size:.9rem;color:var(--sub)}
.rules summary{cursor:pointer;font-weight:700;color:var(--ink)}
.rules ul{padding-left:1.2em;margin:.5em 0 0}

@media (max-width:640px){
  .wrap{padding:8px 10px 24px}
  header{gap:6px;margin-bottom:6px}
  h1{font-size:1.15rem}
  .lead{display:none}
  .tabs{width:100%}
  .tabs{padding:3px}
  .tabs button{flex:1;padding:5px 4px;font-size:.9rem}
  .qbar{margin-bottom:8px}
  .arrow{height:34px;flex-basis:32px}
  .arrow{display:block}
  .nums{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px;scrollbar-width:none;flex:1;min-width:0}
  .nums::-webkit-scrollbar{display:none}
  .nums{padding:3px 2px}
  .nums button{flex:0 0 auto;scroll-snap-align:center;width:34px;height:34px;font-size:.85rem}
  main{gap:10px}
  .board{padding:8px;border-radius:18px}
  .cell{margin:2px;border-radius:8px}
  .goal .cup{border-width:3px}
  .panel{background:transparent;border:0;padding:0}
  .panel h2{display:none}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(20,40,80,.12)}
  .dock{padding-top:6px}
  .dock .msg{margin:0 0 6px;min-height:0;padding:4px 10px;font-size:.8rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dock .msg:empty{display:none}
  .dockrow{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
  .tray{display:contents}
  .tray button{flex-direction:row;justify-content:center;padding:4px 4px;gap:6px;border-radius:12px;font-size:.8rem;min-height:46px}
  .tray button>span{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .tray .mini{height:26px;flex:0 0 auto}.tray .mini.s{width:18px}.tray .mini.x{width:36px}
  .count{font-size:1.05rem}
  .btn.primary{font-size:.95rem;padding:6px 6px;line-height:1.25;min-height:46px}
  .actions{margin-top:0;flex-wrap:nowrap}
  .actions .btn{flex:1;padding:10px 4px;font-size:.85rem}
  .rules{margin-top:12px}
}

body.land .wrap{padding:6px 12px 16px;max-width:none}
body.land header{margin-bottom:6px;align-items:center}
body.land h1{font-size:1.1rem}
body.land .lead{display:none}
body.land .tabs button{padding:5px 12px}
body.land .qbar{margin-bottom:8px}
body.land .nums{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
body.land .nums button{flex:0 0 auto;width:32px;height:32px}
body.land .arrow{display:block;height:32px}
body.land main{grid-template-columns:auto minmax(240px,1fr);gap:14px}
body.land .board{padding:8px;border-radius:16px}
body.land .cell{margin:2px;border-radius:8px}
body.land .panel{padding:12px}
body.land .panel h2{display:none}
body.land .tray .mini{height:30px}
body.land .msg{min-height:0;font-size:.85rem;padding:6px 10px}
@media (max-width:380px){.long{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>ころころパズル<span class="dot" style="background:var(--red)"></span><span class="dot" style="background:var(--blue)"></span><span class="dot" style="background:var(--green)"></span></h1>
    <p class="lead">ピースを置いて、ボールを同じ色・同じ番号のゴールへ転がそう。</p>
  </div>
  <div class="tabs" role="group" aria-label="盤面の大きさ">
    <button data-lv="easy">5×5</button><button data-lv="normal">6×6</button><button data-lv="hard">7×7</button>
  </div>
</header>
<div class="qbar"><button class="arrow" id="prevQ" aria-label="前の問題">‹</button><nav class="nums" id="nums" aria-label="問題番号"></nav><button class="arrow" id="nextQ" aria-label="次の問題">›</button></div>
<main>
  <div class="stage"><div class="board" id="board">
    <div class="lanes" id="lanes">
      <div class="zone start" id="start"></div>
      <div class="grid" id="grid"></div>
      <div class="zone goal" id="goal"></div>
      <div class="ballLayer" id="balls"></div>
    </div>
  </div></div>
  <section class="panel">
    <h2 id="qtitle">問題</h2>
    <div class="dock">
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <div class="dockrow">
        <div class="tray">
          <button id="pickS" data-t="S"><div class="mini s"></div><span>直線 <span class="count" id="cS">0</span></span></button>
          <button id="pickX" data-t="X"><div class="mini x"></div><span>交差 <span class="count" id="cX">0</span></span></button>
        </div>
        <button class="btn primary" id="roll"><span class="long">ボールを</span>転がす</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="reset">最初から</button>
      <button class="btn" id="answer">こたえを見る</button>
    </div>
    <details class="rules">
      <summary>あそびかた</summary>
      <ul>
        <li>下のトレイからピースを選び、空いているマスをタップして置きます。置いたピースをもう一度タップすると1つずつ戻せます。「最初から」で全部やり直せます。</li>
        <li>直線ピースはボールをまっすぐ下へ。交差ピースは横2マス分の大きさで、ボールをとなりの列へ移します。</li>
        <li>黄色のピースははじめから置いてあり、動かせません。</li>
        <li>灰色はトンネル。中が直線2つなのか交差なのかは見えません。転がして確かめよう。</li>
        <li>ピースを全部使い切って、すべてのボールが同じ色のゴールに入ればクリアです。</li>
      </ul>
    </details>
  </section>
</main>
</div>

nv":{"S":10,"X":10},"balls":[{"lane":0,"color":"red"},{"lane":1,"color":"orange"},{"lane":2,"color":"green"},{"lane":3,"color":"teal"},{"lane":4,"color":"blue"},{"lane":5,"color":"purple"},{"lane":6,"color":"pink"}],"goals":[{"lane":2,"color":"red"},{"lane":0,"color":"orange"},{"lane":5,"color":"green"},{"lane":4,"color":"teal"},{"lane":3,"color":"blue"},{"lane":6,"color":"purple"},{"lane":1,"color":"pink"}],"tunnels":[{"r":1,"c":0},{"r":2,"c":5}]},{"rows":7,"cols":7,"grid":[[null,null,"XL","XR",null,null,null],["XL","XR",null,null,null,null,null],["S","XL","XR",null,null,"XL","XR"],[null,null,null,null,"XL","XR",null],[null,null,"XL","XR","XL","XR",null],[null,null,"XL","XR","XL","XR",null],[null,null,null,null,null,null,null]],"solution":[["S","S","XL","XR","S","XL","XR"],["XL","XR","XL","XR","XL","XR","S"],["S","XL","XR","XL","XR","XL","XR"],["XL","XR","XL","XR","XL","XR","S"],["XL","XR","XL","XR","XL","XR","S"],["XL","XR","XL","XR","XL","XR","S"],["XL","XR","XL","XR","S","S","S"]],"inv":{"S":10,"X":10},"balls":[{"lane":0,"color":"red"},{"lane":1,"color":"orange"},{"lane":2,"color":"green"},{"lane":3,"color":"teal"},{"lane":4,"color":"blue"},{"lane":5,"color":"purple"},{"lane":6,"color":"pink"}],"goals":[{"lane":2,"color":"red"},{"lane":0,"color":"orange"},{"lane":1,"color":"green"},{"lane":5,"color":"teal"},{"lane":6,"color":"blue"},{"lane":4,"color":"purple"},{"lane":3,"color":"pink"}],"tunnels":[{"r":5,"c":2},{"r":4,"c":4}]}]};
const COL={red:'var(--red)',orange:'var(--orange)',green:'var(--green)',teal:'var(--teal)',blue:'var(--blue)',purple:'var(--purple)',pink:'var(--pink)'};
const CNAME={red:'赤',orange:'オレンジ',green:'緑',teal:'水色',blue:'青',purple:'むらさき',pink:'ピンク'};
const CNUM={red:1,orange:2,green:3,teal:4,blue:5,purple:6,pink:7};
const LVNAME={easy:'5×5',normal:'6×6',hard:'7×7'};
let lv='easy',idx=0,P=null,grid=null,fixed=null,sel='S',busy=false,raf=0;
const $=id=>document.getElementById(id);
let prog={};
try{prog=JSON.parse(localStorage.getItem('korokoro-progress-v5')||'{}')||{}}catch(e){prog={}}
function saveProg(){try{localStorage.setItem('korokoro-progress-v5',JSON.stringify(prog))}catch(e){}}
const svgS=(stroke)=>`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="38" y="0" width="24" height="100" rx="4" fill="${stroke}"/></svg>`;
const svgX=(stroke)=>`<svg viewBox="0 0 200 100" preserveAspectRatio="none"><path d="M50 0 L150 100 M150 0 L50 100" stroke="${stroke}" stroke-width="22" stroke-linecap="butt" fill="none"/></svg>`;
document.querySelector('#pickS .mini').innerHTML=svgS('#C9D3E3');
document.querySelector('#pickX .mini').innerHTML=svgX('#C9D3E3');

function isTunnel(r,c){return P.tunnels.some(t=>t.r===r&&(t.c===c||t.c+1===c))}
function tunnelStart(r,c){return P.tunnels.some(t=>t.r===r&&t.c===c)}
function remaining(){let s=P.inv.S,x=P.inv.X;
  for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){if(fixed[r][c])continue;if(grid[r][c]==='S')s--;if(grid[r][c]==='XL')x--}
  return{S:s,X:x}}
let ZF=.9;let VW=window.innerWidth,VH=window.innerHeight;
function stageTop(){return document.querySelector('.stage').getBoundingClientRect().top+window.scrollY}
function sizeBoard(){
  const mobile=window.innerWidth<=640;
  const land=!mobile&&window.innerHeight<=520&&window.innerWidth>window.innerHeight;
  document.body.classList.toggle('land',land);
  ZF=(mobile||land)?.72:.9;
  const root=document.documentElement;root.style.setProperty('--zf',ZF);
  const pad=mobile?16:28;
  const W=Math.min(window.innerWidth,980);const stageW=land?window.innerWidth-24-14-260:window.innerWidth>900?W-32-24-300:(document.querySelector('.stage').clientWidth||W-32);
  let cs=Math.floor((Math.min(stageW,600)-pad)/P.cols);
  if(mobile){
    const dockH=document.querySelector('.dock').offsetHeight||110;
    document.querySelector('.wrap').style.paddingBottom=(dockH+16)+'px';
    const top=stageTop();
    const availH=VH-Math.max(dockH,100)-top-pad-16;
    cs=Math.max(34,Math.min(cs,Math.floor(availH/(P.rows+2*ZF))));
  }else if(land){
    document.querySelector('.wrap').style.paddingBottom='';
    const top=stageTop();
    cs=Math.max(30,Math.min(cs,Math.floor((VH-top-pad-10)/(P.rows+2*ZF))));
  }else{document.querySelector('.wrap').style.paddingBottom='';if(window.innerWidth>900)cs=Math.min(cs,Math.floor((window.innerHeight-250)/(P.rows+2*ZF)))}
  cs=Math.max(30,Math.min(76,cs));
  root.style.setProperty('--cs',cs+'px');
  $('lanes').style.setProperty('--cols',P.cols);$('lanes').style.setProperty('--rows',P.rows);
}
function load(){
  stopAnim();busy=false;
  P=DATA[lv][idx];
  grid=P.grid.map(r=>r.slice());fixed=P.grid.map(r=>r.map(v=>v!==null));
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lv===lv));
  $('qtitle').textContent=`${LVNAME[lv]} 第${idx+1}問`;
  sel=P.inv.S>0?'S':'X';
  sizeBoard();renderNums();renderZones();render();placeBallsAtStart();
  setMsg(P.tunnels.length?'トンネルの中は見えません。転がして確かめながら考えよう。':'空いているマスにピースを置こう。');
}
function renderNums(){
  const n=$('nums');n.innerHTML='';
  DATA[lv].forEach((_,i)=>{const b=document.createElement('button');b.textContent=i+1;
    b.setAttribute('aria-label',`第${i+1}問${prog[lv+i]?'（クリア済み）':''}`);
    if(i===idx)b.setAttribute('aria-current','true');if(prog[lv+i])b.classList.add('done');
    b.onclick=()=>{idx=i;load()};n.appendChild(b)});
  const cur=n.children[idx];if(cur&&n.scrollWidth>n.clientWidth)n.scrollLeft=cur.offsetLeft-n.offsetLeft-n.clientWidth/2+cur.offsetWidth/2;
}
function renderZones(){
  const s=$('start'),g=$('goal');s.innerHTML='';g.innerHTML='';
  for(let c=0;c<P.cols;c++){
    const a=document.createElement('div');a.className='slot';s.appendChild(a);
    const b=document.createElement('div');b.className='slot';const cup=document.createElement('div');cup.className='cup';
    const gl=P.goals.find(x=>x.lane===c);if(gl){cup.style.borderColor=COL[gl.color];cup.style.background=`color-mix(in srgb, ${COL[gl.color]} 35%, var(--well))`;cup.setAttribute('aria-label',CNAME[gl.color]+'のゴール');cup.textContent=CNUM[gl.color]}
    b.appendChild(cup);g.appendChild(b);
  }
}
function render(){
  const G=$('grid');G.innerHTML='';
  for(let r=0;r<P.rows;r++){for(let c=0;c<P.cols;c++){
    let el;const v=grid[r][c];
    if(tunnelStart(r,c)){el=document.createElement('div');el.className='cell tunnel';el.style.gridColumn=`${c+1}/span 2`;
      el.innerHTML='<svg viewBox="0 0 100 60"><path d="M10 58 V32 A40 28 0 0 1 90 32 V58" fill="none" stroke="#fff" stroke-width="7"/><text x="50" y="50" text-anchor="middle" font-size="26" fill="#fff" font-weight="800">?</text></svg>';
      el.setAttribute('aria-label','トンネル');el.style.gridRow=r+1;G.appendChild(el);c++;continue}
    if(v==='XR')continue;
    if(v===null){el=document.createElement('button');el.className='cell empty';el.setAttribute('aria-label',`${r+1}段目 ${c+1}列目 空きマス`);
      el.onclick=((rr,cc)=>()=>place(rr,cc))(r,c)}
    else{const f=fixed[r][c];el=document.createElement(f?'div':'button');el.className='cell piece'+(f?' fixed':'');
      const gc=f?'#D9A21C':'#C9D3E3';
      if(v==='S'){el.innerHTML=svgS(gc)}else{el.innerHTML=svgX(gc);el.style.gridColumn=`${c+1}/span 2`}
      el.setAttribute('aria-label',`${r+1}段目 ${v==='S'?'直線':'交差'}ピース${f?'（固定）':'（タップで戻す）'}`);
      if(!f)el.onclick=((rr,cc)=>()=>removeAt(rr,cc))(r,c)}
    el.style.gridRow=r+1;if(!el.style.gridColumn)el.style.gridColumn=c+1;G.appendChild(el);
    if(v==='XL')c++;
  }}
  const rem=remaining();$('cS').textContent=rem.S;$('cX').textContent=rem.X;
  $('pickS').disabled=rem.S<=0;$('pickX').disabled=rem.X<=0;
  if(rem[sel]<=0){if(rem.S>0)sel='S';else if(rem.X>0)sel='X'}
  $('pickS').setAttribute('aria-pressed',sel==='S');$('pickX').setAttribute('aria-pressed',sel==='X');
}
function place(r,c){
  if(busy)return;placeBallsAtStart();const rem=remaining();
  if(rem[sel]<=0){setMsg('そのピースはもう残っていません。');return}
  if(sel==='S'){grid[r][c]='S'}
  else{let L=-1;if(c+1<P.cols&&grid[r][c+1]===null&&!isTunnel(r,c+1))L=c;else if(c-1>=0&&grid[r][c-1]===null&&!isTunnel(r,c-1))L=c-1;
    if(L<0){setMsg('交差ピースは、横に2マス続けて空いているところに置けます。','ng');return}
    grid[r][L]='XL';grid[r][L+1]='XR'}
  render();const rm=remaining();setMsg(rm.S+rm.X===0?'全部置けました。ボールを転がしてみよう。':'');
}
function removeAt(r,c){if(busy)return;placeBallsAtStart();
  if(grid[r][c]==='XL'){grid[r][c]=null;grid[r][c+1]=null}else grid[r][c]=null;render();setMsg('')}
function ballEls(){const L=$('balls');L.innerHTML='';return P.balls.map(b=>{const d=document.createElement('div');d.className='ball';d.style.backgroundColor=COL[b.color];d.textContent=CNUM[b.color];L.appendChild(d);return d})}
function cs(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs'))}
function setPos(el,x,y){el._x=x;el._y=y;const s=cs();el.style.left=(x*s)+'px';el.style.top=(ZF*s+y*s)+'px'}
function placeBallsAtStart(){stopAnim();setCleared(false);busy=false;setDisabled(false);const els=ballEls();P.balls.forEach((b,i)=>setPos(els[i],b.lane+.5,-.45))}
function pathOf(b){
  let l=b.lane;const pts=[{x:l+.5,y:-.45,h:false},{x:l+.5,y:0,h:false}];
  for(let r=0;r<P.rows;r++){const v=grid[r][l];const hid=isTunnel(r,l);
    if(v===null){pts.push({x:l+.5,y:r+.45,h:false});return{pts,stuck:true,lane:l}}
    let nl=l;if(v==='XL')nl=l+1;if(v==='XR')nl=l-1;
    pts.push({x:nl+.5,y:r+1,h:hid});l=nl}
  pts.push({x:l+.5,y:P.rows+.45,h:false});return{pts,stuck:false,lane:l}
}
let cleared=false;
function setCleared(v){cleared=v;const r=$('roll');r.innerHTML=v?'次の問題へ':'<span class="long">ボールを</span>転がす';r.classList.toggle('go',v)}
function setDisabled(d){['roll','answer'].forEach(i=>$(i).disabled=d)}
let timer=0;
function stopAnim(){clearTimeout(timer);timer=0}
function roll(){
  if(busy)return;placeBallsAtStart();busy=true;setDisabled(true);setMsg('ころころ…');
  const els=ballEls();const paths=P.balls.map(pathOf);
  const seg=380;
  const maxSeg=Math.max(...paths.map(p=>p.pts.length-1));const t0=Date.now();
  function step(){
    const t=(Date.now()-t0)/seg;
    paths.forEach((p,i)=>{const n=p.pts.length-1;const k=Math.max(0,Math.min(Math.floor(t),n-1)),f=Math.min(1,Math.max(0,t-k));
      const a=p.pts[k],b=p.pts[k+1];const e=f*f*(3-2*f);
      setPos(els[i],a.x+(b.x-a.x)*e,a.y+(b.y-a.y)*e);
      els[i].style.opacity=(b.h&&t<n)?0:1;
      });
    if(t<maxSeg){timer=setTimeout(step,16)}else{timer=0;finish(paths)}
  }
  step();
}
function finish(paths){
  busy=false;setDisabled(false);
  const rem=remaining();const stuck=paths.some(p=>p.stuck);
  const ok=!stuck&&P.balls.every((b,i)=>{const g=P.goals.find(x=>x.color===b.color);return g.lane===paths[i].lane});
  if(stuck){setMsg('空いているマスでボールが止まりました。ルートをつなげよう。','ng');return}
  if(!ok){const w=P.balls.filter((b,i)=>P.goals.find(x=>x.color===b.color).lane!==paths[i].lane).map(b=>CNAME[b.color]);
    setMsg(`${w.join('・')}のボールが、ちがうゴールに入りました。`,'ng');return}
  if(rem.S+rem.X>0){setMsg('ボールは正しく入りました。でもピースがまだ残っています。全部使うルートを探そう。','ng');return}
  prog[lv+idx]=1;saveProg();renderNums();setCleared(true);
  const last=idx===DATA[lv].length-1;
  setMsg(last?`クリア！「${LVNAME[lv]}」を全部終えました。`:'クリア！「次の問題」へ進もう。','ok');
}
function setMsg(t,k){const m=$('msg');m.textContent=t;m.className='msg'+(k?' '+k:'')}
$('pickS').onclick=()=>{sel='S';render()};$('pickX').onclick=()=>{sel='X';render()};
$('roll').onclick=()=>{if(cleared){goNext();return}roll()};
$('prevQ').onclick=()=>{if(idx>0){idx--;load()}};
$('nextQ').onclick=()=>{if(idx<DATA[lv].length-1){idx++;load()}};
$('reset').onclick=()=>{stopAnim();busy=false;setDisabled(false);grid=P.grid.map(r=>r.slice());placeBallsAtStart();render();setMsg('ピースとボールを最初の状態に戻しました。')};
$('answer').onclick=()=>{grid=P.solution.map(r=>r.slice());placeBallsAtStart();render();setMsg('こたえを置きました。転がして確かめよう。')};
function goNext(){const order=['easy','normal','hard'];if(idx<DATA[lv].length-1)idx++;else{const j=order.indexOf(lv);if(j<2){lv=order[j+1];idx=0}}load()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{lv=b.dataset.lv;idx=0;load()});
let rt;function onViewport(){clearTimeout(rt);rt=setTimeout(()=>{
  const w=window.innerWidth,h=window.innerHeight;
  // スクロールでアドレスバーが出入りするだけの高さ変化は無視する
  if(w===VW&&Math.abs(h-VH)<160)return;
  VW=w;VH=h;sizeBoard();
  document.querySelectorAll('.ball').forEach(el=>{if(el._x!==undefined)setPos(el,el._x,el._y)});
},150)}
window.addEventListener('resize',onViewport);window.addEventListener('orientationchange',onViewport);
load();
</script>
